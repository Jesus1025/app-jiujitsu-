name: CI

on:
  push:
  workflow_dispatch:

jobs:
  app:
    name: App (tipos, lint y formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  database:
    name: Base de datos (migraciones y RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase db start
      - run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar la app con los tipos generados desde la base real
        run: |
          supabase gen types typescript --local > src/types/database.ts
          npx tsc --noEmit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-types
          path: src/types/database.ts
